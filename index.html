<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diffram — A different frame on lead-gen.</title>
<link rel="icon" type="image/svg+xml" href="diffram-mark-signal.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root{
    --bg:#eef0f3;
    --paper:#f7f8fa;
    --ink:#0d1220;
    --ink-2:#4a5063;
    --rule:#d3d8e0;
    --signal:#1f5fff;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Inter', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  body{ font-feature-settings:'ss01','cv11'; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }

  /* PAGE GRID */
  .page{ max-width:1440px; margin:0 auto; padding:0 80px; }

  /* MONO META RAIL */
  .mono{ font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }

  /* NAV */
  .nav{ position:sticky; top:0; z-index:50; background:color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter:saturate(140%) blur(14px); border-bottom:1px solid var(--rule); }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; height:72px; }
  .nav-brand{ display:flex; align-items:center; gap:14px; }
  .nav-brand .wordmark{ font-size:22px; font-weight:500; letter-spacing:-0.02em; }
  .nav-mark{ width:28px; height:28px; }
  .nav-meta{ display:flex; align-items:center; gap:32px; }
  .nav-meta .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--signal); margin-right:8px; vertical-align:middle; animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{ opacity:.45; transform:scale(1);} 50%{ opacity:1; transform:scale(1.3);} }
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    height:44px; padding:0 20px;
    background:var(--ink); color:#fbfaf7;
    border:1px solid var(--ink); border-radius:0;
    font-size:14px; font-weight:500; letter-spacing:-0.005em;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:hover{ background:var(--signal); border-color:var(--signal); }
  .btn .arrow{ width:14px; height:14px; }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--rule); }
  .btn-ghost:hover{ background:var(--ink); color:#fbfaf7; border-color:var(--ink); }
  .btn-lg{ height:56px; padding:0 28px; font-size:16px; }

  /* HERO */
  .hero.page{ padding-top:96px; padding-bottom:88px; position:relative; }
  .hero-eyebrow{ display:flex; align-items:center; gap:14px; margin-bottom:48px; }
  .hero-eyebrow .rule{ flex:0 0 56px; height:1px; background:var(--ink); }
  .hero-h1{
    font-size: clamp(56px, 8vw, 124px);
    line-height:.96;
    letter-spacing:-0.045em;
    font-weight:500;
    margin:0;
    text-wrap:balance;
  }
  .hero-h1 .em{ color:var(--signal); font-style:normal; }
  .hero-sub{ font-size:22px; line-height:1.45; color:var(--ink-2); max-width:680px; margin:36px 0 0; }
  .hero-cta{ display:flex; align-items:center; gap:24px; margin-top:48px; flex-wrap:wrap; }
  .hero-cta .availability{ font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:.06em; color:var(--ink-2); text-transform:uppercase; }

  /* BIG MARK BACKDROP */
  .hero-mark{
    position:absolute; right:-60px; top:80px;
    width:520px; height:520px; opacity:.06; pointer-events:none;
  }

  /* VSL */
  .vsl.page{ padding-bottom:120px; }
  .vsl-frame{
    position:relative;
    aspect-ratio: 16/9;
    background:var(--ink);
    border:1px solid var(--ink);
    overflow:hidden;
    cursor:pointer;
  }
  .vsl-frame::before{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(120% 80% at 50% 50%, rgba(31,95,255,.18), transparent 60%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 2px, transparent 2px 14px);
  }
  .vsl-meta{
    position:absolute; top:24px; left:24px; right:24px;
    display:flex; justify-content:space-between; align-items:center;
    color:rgba(255,255,255,.72);
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  }
  .vsl-meta .rec{ display:flex; align-items:center; gap:8px; }
  .vsl-meta .rec-dot{ width:8px; height:8px; border-radius:50%; background:#ff3b3b; box-shadow:0 0 10px rgba(255,59,59,.7); }
  .vsl-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; color:#fbfaf7;
  }
  .vsl-play{
    width:88px; height:88px; border-radius:50%;
    background:var(--signal); display:flex; align-items:center; justify-content:center;
    transition:transform .25s ease, box-shadow .25s ease;
    box-shadow:0 0 0 0 rgba(31,95,255,0);
  }
  .vsl-frame:hover .vsl-play{ transform:scale(1.08); box-shadow:0 0 0 16px rgba(31,95,255,.18); }
  .vsl-label{ font-family:'JetBrains Mono', monospace; font-size:13px; letter-spacing:.18em; text-transform:uppercase; opacity:.85; }
  .vsl-title{ font-size:28px; font-weight:500; letter-spacing:-0.015em; max-width:540px; text-align:center; line-height:1.2; }
  .vsl-foot{
    position:absolute; bottom:24px; left:24px; right:24px;
    display:flex; justify-content:space-between; align-items:center;
    color:rgba(255,255,255,.6);
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  }
  .vsl-cap{ display:flex; gap:12px; align-items:center; margin-top:18px; color:var(--ink-2); font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
  .vsl-cap .ic{ width:14px; height:14px; }

  /* DIVIDER */
  .div-rule{ border-top:1px solid var(--rule); }
  .section-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:32px 0 12px;
  }
  .section-meta h3{ font-size:14px; font-weight:500; margin:0; }

  /* VALUE PROP */
  .vp.page{ padding-top:48px; padding-bottom:140px; }
  .vp-grid{ display:grid; grid-template-columns: 1fr 1.2fr; gap:88px; align-items:start; }
  .vp-h{
    font-size: clamp(40px, 4.6vw, 72px);
    line-height:1.02; letter-spacing:-0.035em; font-weight:500; margin:0;
    text-wrap:balance;
  }
  .vp-h .em{ color:var(--signal); }
  .vp-body{ display:flex; flex-direction:column; gap:32px; }
  .vp-lede{ font-size:20px; line-height:1.55; color:var(--ink); margin:0; max-width:560px; }
  .vp-lede strong{ font-weight:500; }
  .vp-points{ display:grid; gap:0; border-top:1px solid var(--rule); }
  .vp-point{
    display:grid; grid-template-columns:48px 1fr; gap:24px;
    padding:24px 0; border-bottom:1px solid var(--rule);
    align-items:start;
  }
  .vp-point .num{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--signal); letter-spacing:.06em; padding-top:4px; }
  .vp-point .pt-h{ font-size:18px; font-weight:500; margin:0 0 6px; letter-spacing:-0.01em; }
  .vp-point .pt-b{ font-size:15px; line-height:1.55; color:var(--ink-2); margin:0; max-width:420px; }

  /* PORTFOLIO PLACEHOLDER */
  .pf.page{ padding-top:48px; padding-bottom:140px; }

  /* OFFER */
  .offer-wrap{ padding-top:24px; }
  .offer-head{ display:grid; grid-template-columns: 1.4fr 1fr; gap:64px; align-items:end; margin-bottom:56px; }
  .offer-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); }
  .offer-card{
    padding:36px 32px 40px;
    border-right:1px solid var(--rule);
    display:flex; flex-direction:column; gap:14px;
    background:var(--paper);
    transition:background .15s ease;
  }
  .offer-card:last-child{ border-right:none; }
  .offer-card:hover{ background:color-mix(in oklab, var(--signal) 6%, var(--paper)); }
  .offer-num{
    font-family:'JetBrains Mono', monospace;
    font-size:13px; letter-spacing:.06em;
    color:var(--signal);
    margin-bottom:48px;
  }
  .offer-h{ font-size:22px; font-weight:500; margin:0; letter-spacing:-0.015em; line-height:1.2; }
  .offer-b{ font-size:15px; line-height:1.55; color:var(--ink-2); margin:0; }
  .offer-cta-row{ display:flex; align-items:center; justify-content:space-between; gap:24px; padding-top:40px; flex-wrap:wrap; }

  @media (max-width: 900px){
    .offer-head{ grid-template-columns:1fr; gap:24px; }
    .offer-grid{ grid-template-columns:1fr; }
    .offer-card{ border-right:none; border-bottom:1px solid var(--rule); }
    .offer-card:last-child{ border-bottom:none; }
  }
  .pf-h{ font-size: clamp(36px, 4vw, 56px); line-height:1.05; letter-spacing:-0.03em; font-weight:500; margin:0 0 12px; max-width:760px; }
  .pf-sub{ font-size:18px; color:var(--ink-2); margin:0 0 48px; max-width:560px; line-height:1.5; }
  .pf-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:20px; }
  .pf-card{
    aspect-ratio: 4/5;
    background:var(--paper);
    border:1px solid var(--rule);
    position:relative;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:24px;
    overflow:hidden;
  }
  .pf-card::before{
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(135deg, transparent 49.5%, var(--rule) 49.5%, var(--rule) 50.5%, transparent 50.5%),
      linear-gradient(45deg, transparent 49.5%, var(--rule) 49.5%, var(--rule) 50.5%, transparent 50.5%);
    opacity:.4;
  }
  .pf-card .pf-tag{ position:relative; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }
  .pf-card .pf-status{ position:relative; font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--signal); }

  /* FINAL CTA */
  .final{
    background:var(--ink); color:#fbfaf7;
    padding:120px 80px 100px;
    margin-top:0;
  }
  .final-inner{ max-width:1280px; margin:0 auto; display:grid; grid-template-columns: 1fr; gap:48px; }
  .final h2{
    font-size: clamp(56px, 8vw, 132px);
    line-height:.95; letter-spacing:-0.045em; font-weight:500; margin:0;
    text-wrap:balance;
  }
  .final h2 .em{ color:#7ea3ff; }
  .final-row{ display:flex; justify-content:space-between; align-items:flex-end; gap:48px; flex-wrap:wrap; }
  .final-sub{ font-size:20px; color:rgba(255,255,255,.62); max-width:560px; margin:0; line-height:1.5; }
  .btn-light{ background:#fbfaf7; color:var(--ink); border-color:#fbfaf7; }
  .btn-light:hover{ background:var(--signal); border-color:var(--signal); color:#fbfaf7; }

  /* FOOTER */
  .foot{ background:var(--ink); color:rgba(255,255,255,.55); padding:32px 80px 40px; border-top:1px solid rgba(255,255,255,.08); }
  .foot-inner{ max-width:1280px; margin:0 auto; display:flex; justify-content:space-between; gap:24px; font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }

  /* RESPONSIVE */
  @media (max-width: 900px){
    .page{ padding:0 24px; }
    .vp-grid{ grid-template-columns:1fr; gap:48px; }
    .pf-grid{ grid-template-columns:1fr; }
    .hero-mark{ display:none; }
    .final{ padding:80px 24px; }
    .foot{ padding:24px; }
    .foot-inner{ flex-direction:column; gap:8px; }
  }
</style>
</head>
<body>

<!-- ===== INLINE LOGO USED MULTIPLE PLACES ===== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="diffram-mark" viewBox="0 0 240 240">
      <g fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="miter">
        <rect x="20" y="20" width="200" height="200"/>
        <polygon points="60,20 220,20 220,180"/>
        <polygon points="20,60 180,220 20,220"/>
      </g>
      <rect x="100" y="100" width="40" height="40" fill="var(--signal)"/>
    </symbol>
  </defs>
</svg>

<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="diffram-site.jsx"></script>

<!-- Tweaks defaults persisted to disk -->
<script>
  window.__DIFFRAM_TWEAKS = /*EDITMODE-BEGIN*/{
    "headline": "A different frame on cold email.",
    "subhead": "Diffram is the cold-email studio for B2B teams who want a system, not another agency. Run a 14-day campaign on us — you only pay if it works.",
    "ctaLabel": "Start your 14-day campaign",
    "availability": "Currently taking 4 client slots per month",
    "valuePropTitle": "One channel, done right. Cold email as an engineered system.",
    "showSignal": true,
    "darkMode": false
  }/*EDITMODE-END*/;
</script>

</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <title>Diffram Stacked Lockup</title>
  <g transform="translate(40,20)">
    <g fill="none" stroke="#0d1220" stroke-width="10" stroke-linejoin="miter">
      <rect x="20" y="20" width="200" height="200"></rect>
      <polygon points="60,20 220,20 220,180"></polygon>
      <polygon points="20,60 180,220 20,220"></polygon>
    </g>
    <rect x="100" y="100" width="40" height="40" fill="#1f5fff"></rect>
  </g>
  <text x="160" y="320" text-anchor="middle" font-family="&#39;Inter&#39;, system-ui, sans-serif" font-size="56" font-weight="500" fill="#0d1220" letter-spacing="-1">Diffram</text>
</svg>